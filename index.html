<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="description" content="Omega AI Assistant" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="logo.png" />
  <title>Omega AI Assistant</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
/>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="app-header">
    <div class="header-left">
      <button id="sidebarToggle" class="menu-btn">☰</button>

      <div>
        <h1>My chatbot</h1>
        <p>Ask me anything</p>
      </div>
    </div>
  </header>

  <!-- ================= MAIN APP ================= -->
  <div class="app-container">

    <!-- ========== SIDEBAR ========== -->
    <aside id="sidebar" class="sidebar">

      <div class="sidebar-header">
        <h2>Chats</h2>

        <button
          id="newChatBtn"
          class="new-chat-btn"
        >
          + New
        </button>
      </div>

      <div
        id="chatList"
        class="chat-list"
      >
        <!-- Chat sessions will appear here -->
      </div>

    </aside>

    <!-- ========== MAIN CHAT AREA ========== -->
    <main class="chat-section">

      <!-- Chat Header -->
      <div class="chat-header">

        <h2 id="chatTitle">
          Omega AI Assistant
        </h2>

        <div class="chat-actions">

          <button
            id="clearBtn"
            class="action-btn"
          >
            Clear
          </button>

          <button
            id="logoutBtn"
            class="logout-btn"
          >
            Logout
          </button>

        </div>
      </div>

      <!-- Chat Messages -->
      <div
        id="chatContainer"
        class="chat-container"
      ></div>

      <!-- Input Area -->
      <div class="input-container">

        <input
          type="text"
          id="userInput"
          placeholder="Type a message..."
          autocomplete="off"
        />

        <button id="sendBtn">
          Send
        </button>

      </div>

    </main>
  </div>

  <!-- ================= AUTH MODAL ================= -->
  <div id="authModal" class="modal">

    <div class="modal-content">

      <h2>Welcome</h2>

      <input
        type="email"
        id="email"
        placeholder="Email"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
      />

      <button id="loginBtn">
        Login
      </button>

      <button id="signupBtn">
        Sign Up
      </button>

    </div>
  </div>

  <!-- ================= MAIN SCRIPT ================= -->
  <script src="script.js"></script>

<div
  id="chatSheetOverlay"
  class="chat-sheet-overlay"
  onclick="closeChatSheet()"
></div>

<div
  id="chatSheet"
  class="chat-sheet"
>
  <div class="chat-sheet-handle"></div>

  <div
    class="chat-sheet-item delete"
    onclick="deleteSelectedChat()"
  >
    🗑 Delete
  </div>

  <div
    class="chat-sheet-item"
    onclick="renameSelectedChat()"
  >
    ✏ Rename
  </div>
</div>

</body>
  </html>
